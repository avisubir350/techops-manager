   # ── Job 3: Build & Push Docker Image ──────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    # needs: sonarqube-scan
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: |
          echo "tag=v1.0" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/techops-manager-app:latest
            ${{ secrets.DOCKER_USERNAME }}/techops-manager-app:${{ steps.vars.outputs.tag }}
   # ── Job 4: GitOps — Update config repo ────────────────────────────────────
  gitops-update:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'
    steps:
      - name: Checkout Techops-config
        uses: actions/checkout@v4
        with:
          repository: 'avisubir350/Techops-config'
          token: ${{ secrets.GITOPS_TOKEN }}
          path: 'weather-config'
          ref: 'main' # Fetch the branch where deployment.yml lives

      - name: Update Kubernetes manifest
        run: |
          cd Techops-config
          
          # 1. Update the image tag in deployment.yml
          # Using a specific filename since you confirmed it exists in main
          sed -i "s|image:.*|image: ${{ secrets.DOCKER_USERNAME }}/techops-manager-app:${{ needs.build-and-push.outputs.image_tag }}|g" techops-manifest.yml

          # 2. Configure Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 3. Commit and Push specifically to main
          git add deployment.yml
          
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping push."
          else
            git commit -m "chore: update image to ${{ needs.build-and-push.outputs.image_tag }} [skip ci]"
            # Explicitly push the local 'main' branch to the remote 'main'
            git push origin main
          fi
