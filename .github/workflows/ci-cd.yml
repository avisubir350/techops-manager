  #       with:
  #         fetch-depth: 0  # required for accurate blame & new code detection
  #
  #     - name: Download coverage report
  #       uses: actions/download-artifact@v4
  #       with:
  #         name: coverage-report
  #
  #     - name: SonarQube Scan
  #       uses: SonarSource/sonarqube-scan-action@v6
  #       env:
  #         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  #         SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  #       with:
  #         args: >
  #           -Dsonar.projectKey=Techops-manager
  #           -Dsonar.projectName=Techops-manager
  #           -Dsonar.sources=.
  #           -Dsonar.python.version=3
  #           -Dsonar.python.coverage.reportPaths=coverage.xml
  #           -Dsonar.exclusions=**/venv/**,**/.git/**,**/__pycache__/**,**/dependency-check-report/**
  #
  #     - name: SonarQube Quality Gate check
  #       uses: SonarSource/sonarqube-quality-gate-action@v1
  #       timeout-minutes: 5
  #       env:
  #         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  #         SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ── Job 3: Build & Push Docker Image ──────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    needs: lint-and-test
    # needs: sonarqube-scan
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: |
          echo "tag=v1.0" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/techops-manager-app:latest
            ${{ secrets.DOCKER_USERNAME }}/techops-manager-app:${{ steps.vars.outputs.tag }}

  # ── Job 4: GitOps — Update config repo ────────────────────────────────────
  gitops-update:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'
    steps:
      - name: Checkout Techops-config
        uses: actions/checkout@v4
        with:
          repository: 'avisubir350/Techops-config'
          token: ${{ secrets.GITOPS_TOKEN }}
          path: 'Techops-config'
          ref: 'main'

      - name: List config repo files
        run: ls -la Techops-config/

      - name: Update Kubernetes manifest
        run: |
          cd Techops-config

          # Find the manifest file (adjust name if different)
          MANIFEST_FILE="techops-manifest.yml"

          if [ ! -f "$MANIFEST_FILE" ]; then
            echo "ERROR: $MANIFEST_FILE not found. Files in repo:"
            ls -la
            exit 1
          fi

          sed -i "s|image:.*|image: ${{ secrets.DOCKER_USERNAME }}/techops-manager-app:${{ needs.build-and-push.outputs.image_tag }}|g" "$MANIFEST_FILE"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add "$MANIFEST_FILE"

          if git diff --staged --quiet; then
            echo "No changes detected. Skipping push."
          else
            git commit -m "chore: update image to ${{ needs.build-and-push.outputs.image_tag }} [skip ci]"
            git push origin main
          fi
