name: TechOps Manager CI/CD Pipeline

on:
  push:
    branches: [ devops ]
  pull_request:
    branches: [ devops ]

jobs:

  # ── Job 1: Lint, Test & OWASP ─────────────────────────────────────────────
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for SonarQube blame data
