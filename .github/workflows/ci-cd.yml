   # ── Job 3: Build & Push Docker Image ──────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    # needs: sonarqube-scan
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short git SHA as tag
        id: vars
        run: |
          echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          # Ensure context is '.' to use the Dockerfile in the current directory
          context: .
          push: true
          # Note: Changed underscore to hyphen to match your request 'techops-manager'
          # Docker Hub naming conventions prefer hyphens over underscores
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/techops-manager:latest
            ${{ secrets.DOCKER_USERNAME }}/techops-manager:${{ steps.vars.outputs.tag }}
