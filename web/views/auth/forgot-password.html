<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      href="../../assets/img/company_logo.png"
    />
    <title>Lokenath Computer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
    <style>
      .bg-mesh {
        background-color: #4f46e5;
        background-image: radial-gradient(
            at 0% 0%,
            hsla(253, 16%, 7%, 1) 0,
            transparent 50%
          ),
          radial-gradient(at 50% 0%, hsla(225, 39%, 30%, 1) 0, transparent 50%);
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      /* Simple styling for OTP input character spacing */
      #otp {
        letter-spacing: 0.5em;
        padding-left: 0.5em;
      }
    </style>
  </head>
  <body class="bg-mesh min-h-screen flex items-center justify-center p-4">
    <div class="relative w-full max-w-md">
      <div class="text-center mb-6">
        <div
          class="inline-block p-1 bg-white/20 rounded-full mb-4 backdrop-blur-sm"
        >
          <img
            src="../../assets/img/lokenath_baba.png"
            alt="Baba Lokenath"
            class="w-24 h-24 rounded-full object-cover border-2 border-white shadow-lg"
          />
        </div>
        <h1 class="text-3xl font-extrabold text-white tracking-tight">
          Lokenath Computer
        </h1>
        <p class="text-indigo-100/80 font-medium">Password Recovery</p>
      </div>

      <div class="glass-card rounded-3xl shadow-2xl p-8">
        <div id="requestFormContainer">
          <header class="mb-8 text-center">
            <div
              class="inline-flex items-center justify-center w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full mb-4"
            >
              <i class="ph-key-hole text-3xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-800">Forgot Password?</h2>
            <p class="text-sm text-gray-500 mt-2">
              Enter your registered email and we'll send a 6-digit OTP code to
              verify your identity.
            </p>
          </header>

          <form id="forgotPasswordForm" class="space-y-6">
            <div>
              <label
                class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1 ml-1"
                >Email Address</label
              >
              <div class="relative">
                <i
                  class="ph-envelope-simple text-gray-400 absolute left-3 top-1/2 -translate-y-1/2 text-xl"
                ></i>
                <input
                  type="email"
                  id="email"
                  required
                  placeholder="your.email@example.com"
                  class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm transition-all"
                />
              </div>
            </div>

            <button
              type="submit"
              id="submitBtn"
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition-all active:scale-95 flex items-center justify-center"
            >
              Get OTP Code
            </button>
          </form>
        </div>

        <div id="otpFormContainer" class="hidden">
          <header class="mb-6 text-center">
            <div
              class="inline-flex items-center justify-center w-16 h-16 bg-green-50 text-green-600 rounded-full mb-4"
            >
              <i class="ph-shield-check text-3xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-800">Verify OTP</h2>
            <p class="text-sm text-gray-500 mt-2">
              We've sent a code to <br /><span
                id="displayEmail"
                class="font-bold text-gray-700"
              ></span>
            </p>
          </header>

          <form id="resetPasswordForm" class="space-y-5">
            <div>
              <label
                class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1"
                >Enter OTP</label
              >
              <input
                type="text"
                id="otp"
                maxlength="6"
                required
                placeholder="000000"
                class="w-full text-center text-2xl font-black py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all"
              />
            </div>

            <div class="space-y-4">
              <div>
                <label
                  class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1"
                  >New Password</label
                >
                <div class="relative">
                  <i
                    class="ph-lock text-gray-400 absolute left-3 top-1/2 -translate-y-1/2 text-xl"
                  ></i>
                  <input
                    type="password"
                    id="newPassword"
                    required
                    placeholder="••••••••"
                    minlength="8"
                    class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm"
                  />
                </div>
              </div>

              <div>
                <label
                  class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1"
                  >Confirm New Password</label
                >
                <div class="relative">
                  <i
                    class="ph-lock-simple text-gray-400 absolute left-3 top-1/2 -translate-y-1/2 text-xl"
                  ></i>
                  <input
                    type="password"
                    id="confirmPassword"
                    required
                    placeholder="••••••••"
                    minlength="8"
                    class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm"
                  />
                </div>
              </div>
            </div>

            <button
              type="submit"
              id="resetBtn"
              class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition-all active:scale-95 flex items-center justify-center"
            >
              Reset Password
            </button>
          </form>

          <button
            onclick="location.reload()"
            class="w-full mt-4 text-xs text-indigo-600 font-bold hover:underline"
          >
            Try a different email
          </button>
        </div>

        <div class="mt-8 pt-6 border-t border-gray-100 text-center">
          <a
            href="login.html"
            class="text-sm text-gray-500 hover:text-indigo-600 font-bold flex items-center justify-center gap-2"
          >
            <i class="ph-arrow-left"></i> Back to Login
          </a>
        </div>
      </div>
    </div>
    <script src="../../assets/js/forgot-password.js"></script>
  </body>
</html>
